<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Klimasteuerung</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:           #080d18;
            --bg-card:      #0d1525;
            --bg-inner:     #060b14;
            --border:       #1a2a45;
            --accent:       #3e9bd4;
            --accent-hover: #5ab2e8;
            --text:         #f0f4ff;
            --text-muted:   #7a9bbf;
            --red:          #e05050;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .logo { font-size: 2.2rem; margin-bottom: 6px; }
        .title { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em; }
        .subtitle { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 28px; }
        .stripe {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--text), var(--accent), transparent);
            border-radius: 2px;
            margin-bottom: 24px;
        }
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-inner);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            letter-spacing: 0.1em;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus { border-color: var(--accent); }
        input[type="password"]::placeholder { letter-spacing: 0; color: var(--text-muted); }
        button {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        .error {
            background: rgba(224,80,80,0.12);
            border: 1px solid rgba(224,80,80,0.3);
            color: var(--red);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.82rem;
            margin-bottom: 14px;
        }
    </style>
    <script>
        const themes = {
            belgrano: {'--bg':'#080d18','--bg-card':'#0d1525','--bg-inner':'#060b14','--border':'#1a2a45','--accent':'#3e9bd4','--accent-hover':'#5ab2e8','--text':'#f0f4ff','--text-muted':'#7a9bbf'},
            nob:      {'--bg':'#0f0f0f','--bg-card':'#1a1a1a','--bg-inner':'#111111','--border':'#2e2e2e','--accent':'#c8102e','--accent-hover':'#e0152e','--text':'#f5f5f5','--text-muted':'#999999'},
            lotaro:   {'--bg':'#132d28','--bg-card':'#1a3a33','--bg-inner':'#112824','--border':'#254d44','--accent':'#e8d96a','--accent-hover':'#f0e580','--text':'#f0ede4','--text-muted':'#8aada6'},
            rg:       {'--bg':'#0c1f10','--bg-card':'#122918','--bg-inner':'#09180d','--border':'#1e3d26','--accent':'#c8562a','--accent-hover':'#e06030','--text':'#f5f0e8','--text-muted':'#8aaa8e'},
            boca:     {'--bg':'#00143c','--bg-card':'#001f58','--bg-inner':'#000f2c','--border':'#002b7a','--accent':'#f5d000','--accent-hover':'#fce030','--text':'#ffffff','--text-muted':'#a0b8e8'},
        };
        const t = themes[localStorage.getItem('theme')] || themes.belgrano;
        Object.entries(t).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
    </script>
</head>
<body>
<div class="card">
    <div class="logo">❄️</div>
    <div class="title">Klimasteuerung</div>
    <div class="subtitle">Bitte Code eingeben</div>
    <div class="stripe"></div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <input type="password" name="code" placeholder="Code" autofocus autocomplete="current-password">
        <button type="submit">Anmelden</button>
    </form>
</div>
</body>
</html>
